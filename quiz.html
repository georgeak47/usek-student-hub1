<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <h1>Quiz</h1>

<div class="question">
  <p>1. What does HTML stand for?</p>
  <label><input type="radio" name="q1" value="a"> Hyper Text Markup Language</label><br>
  <label><input type="radio" name="q1" value="b"> High Tech Modern Language</label><br>
  <label><input type="radio" name="q1" value="c"> Home Tool Markup Language</label>
</div>

<div class="question">
  <p>2. Which CSS property turns on Flexbox?</p>
  <label><input type="radio" name="q2" value="a"> position: flex</label><br>
  <label><input type="radio" name="q2" value="b"> display: flex</label><br>
  <label><input type="radio" name="q2" value="c"> flex: display</label>
</div>

<div class="question">
  <p>3. Which rule applies styles only on certain screen sizes?</p>
  <label><input type="radio" name="q3" value="a"> @import</label><br>
  <label><input type="radio" name="q3" value="b"> @font-face</label><br>
  <label><input type="radio" name="q3" value="c"> @media</label>
</div>

<div class="question">
  <p>4. Which tag links an external CSS file?</p>
  <label><input type="radio" name="q4" value="a"> &lt;link&gt;</label><br>
  <label><input type="radio" name="q4" value="b"> &lt;style&gt;</label><br>
  <label><input type="radio" name="q4" value="c"> &lt;script&gt;</label>
</div>

<div class="question">
  <p>5. Which method finds an element by its id in JavaScript?</p>
  <label><input type="radio" name="q5" value="a"> getElementByClass()</label><br>
  <label><input type="radio" name="q5" value="b"> getElementById()</label><br>
  <label><input type="radio" name="q5" value="c"> findElement()</label>
</div>

<button id="submit">Submit</button>
<p id="result"></p>

<script src="quiz.js"></script>   
</body>
</html>
